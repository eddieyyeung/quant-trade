[project]
name = "quant-trade"
version = "0.1.0"
description = "Quantitative trading research and backtesting framework"
authors = [
    { name = "eddieyyeung", email = "eddie.y.yeung@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "duckdb>=1.0",
    "jinja2>=3.0",
    "akshare>=1.14",
    "baostock>=0.8",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2",
    "ccxt>=4.0",
]
analysis = [
    "pandas-ta>=0.3",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
]
backtest = []
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "ipykernel>=6.0",
    "types-pyyaml>=6.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
all = [
    "quant-trade[data,analysis,backtest,dev,web]",
]

[project.scripts]
quant-trade = "quant_trade.cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line too long handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["quant_trade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=quant_trade --cov-report=term-missing -v"

[tool.coverage.run]
source = ["quant_trade"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
enable_error_code = ["truthy-bool", "redundant-expr"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["tushare", "baostock", "akshare"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
    "scipy-stubs>=1.18.0.1",
]
