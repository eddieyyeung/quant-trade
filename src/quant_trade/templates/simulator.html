<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#1e293b}
.header{background:#1e293b;color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px}
.header h1{font-size:20px}
.header .api-status{font-size:12px;padding:4px 10px;border-radius:4px}
.api-ok{background:#166534}.api-err{background:#991b1b}
.container{max-width:1200px;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card h2{font-size:16px;margin-bottom:12px;color:#334155}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
.form-group{margin-bottom:12px;flex:1;min-width:150px}
.form-group label{display:block;font-size:13px;color:#64748b;margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px}
.btn{padding:8px 16px;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#3b82f6;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn-success{background:#10b981;color:#fff}
.btn-gray{background:#64748b;color:#fff}
.btn-purple{background:#8b5cf6;color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;margin:8px 0}
td,th{border:1px solid #e2e8f0;padding:6px 10px;text-align:left;font-size:13px}
th{background:#f8fafc;color:#64748b;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.tag-buy{background:#dcfce7;color:#166534}
.tag-sell{background:#fee2e2;color:#991b1b}
.tag-active{background:#dbeafe;color:#1e40af}
.tag-completed{background:#e2e8f0;color:#475569}
.tag-paused{background:#fef3c7;color:#92400e}
.pos{color:#16a34a;font-weight:600}.neg{color:#dc2626;font-weight:600}
.warn{background:#fef3c7;color:#92400e;padding:4px 8px;border-radius:4px;font-size:12px;margin:4px 0}
.metrics-grid{display:flex;gap:12px;flex-wrap:wrap}
.metric-card{background:#f8fafc;padding:12px 16px;border-radius:6px;text-align:center;flex:1;min-width:100px}
.metric-card .val{font-size:20px;font-weight:700}
.metric-card .lbl{font-size:11px;color:#64748b}
.empty{color:#94a3b8;font-style:italic}
.section-title{font-size:14px;font-weight:600;color:#475569;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid #e2e8f0}
#detail-content h3{font-size:14px;font-weight:600;color:#475569;margin:16px 0 8px}
</style>
</head>
<body>
<div class="header">
  <h1>Quant Simulator</h1>
  <span id="api-badge" class="api-status api-err">API 未连接</span>
</div>
<div class="container">

<!-- Create Session -->
<div class="card">
  <h2>创建会话</h2>
  <div class="row">
    <div class="form-group"><label>名称</label><input id="c-name" value="复盘测试"></div>
    <div class="form-group"><label>起始日期</label><input id="c-start" type="date" value="2023-06-01"></div>
    <div class="form-group"><label>结束日期(可选)</label><input id="c-end" type="date"></div>
    <div class="form-group"><label>初始资金</label><input id="c-capital" type="number" value="100000"></div>
    <div class="form-group"><label>参考策略</label><select id="c-ref"><option value="">无</option><option value="factor_ranking">因子排名</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="doCreate()">创建</button>
</div>

<!-- Session List -->
<div class="card">
  <h2>会话列表</h2>
  <table id="session-table"><tr><td colspan="6" class="empty">加载中...</td></tr></table>
</div>

<!-- Session Detail -->
<div class="card" id="detail" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h2 id="detail-title">会话详情</h2>
    <div>
      <button class="btn btn-sm btn-gray" onclick="closeDetail()">返回列表</button>
    </div>
  </div>
  <div id="detail-content"></div>
</div>

</div>

<script>
// ---------- config ----------
const API_BASE = 'http://localhost:8000/api';

// ---------- api ----------
async function api(url, opts = {}) {
  if (opts.body && typeof opts.body === 'object') {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(opts.body);
  }
  const r = await fetch(API_BASE + url, opts);
  if (!r.ok) {
    const err = await r.json().catch(() => ({ detail: r.statusText }));
    throw new Error(err.detail || 'Request failed');
  }
  return r.json();
}

async function checkApi() {
  const badge = document.getElementById('api-badge');
  try {
    await fetch(API_BASE + '/sessions');
    badge.textContent = 'API 已连接';
    badge.className = 'api-status api-ok';
  } catch {
    badge.textContent = 'API 未连接';
    badge.className = 'api-status api-err';
  }
}

// ---------- session list ----------
async function loadSessions() {
  const tb = document.getElementById('session-table');
  try {
    const rows = await api('/sessions');
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="6" class="empty">无会话，请创建</td></tr>';
      return;
    }
    tb.innerHTML =
      '<tr><th>ID</th><th>名称</th><th>状态</th><th>当前</th><th>策略</th><th>操作</th></tr>' +
      rows.map(r => `
        <tr>
          <td>${r.id.slice(0, 8)}...</td>
          <td>${r.name}</td>
          <td><span class="tag tag-${r.status}">${r.status}</span></td>
          <td>${r.cursor_date || '-'}</td>
          <td>${r.reference_strategy || '-'}</td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="openSession('${r.id}')">查看</button>
            <button class="btn btn-sm btn-danger" onclick="deleteSession('${r.id}')">删</button>
          </td>
        </tr>`).join('');
  } catch (e) {
    tb.innerHTML = `<tr><td colspan="6" class="empty">加载失败: ${e.message}</td></tr>`;
  }
}

let currentId = null;

// ---------- create ----------
async function doCreate() {
  const q = new URLSearchParams({
    name: document.getElementById('c-name').value,
    start_date: document.getElementById('c-start').value,
    capital: document.getElementById('c-capital').value,
  });
  const ed = document.getElementById('c-end').value; if (ed) q.set('end_date', ed);
  const ref = document.getElementById('c-ref').value; if (ref) q.set('ref', ref);
  try {
    const r = await api('/sessions?' + q, { method: 'POST' });
    currentId = r.session_id;
    renderDetail(r);
    loadSessions();
  } catch (e) { alert('创建失败: ' + e.message); }
}

async function deleteSession(id) {
  if (!confirm('确认删除？')) return;
  try {
    await api('/sessions/' + id, { method: 'DELETE' });
    if (currentId === id) { closeDetail(); }
    loadSessions();
  } catch (e) { alert('删除失败: ' + e.message); }
}

// ---------- detail ----------
async function openSession(id) {
  currentId = id;
  try {
    const r = await api('/sessions/' + id);
    renderDetail(r);
  } catch (e) { alert('加载失败: ' + e.message); }
}

function closeDetail() {
  currentId = null;
  document.getElementById('detail').style.display = 'none';
}

function renderDetail(r) {
  const d = document.getElementById('detail');
  d.style.display = 'block';
  document.getElementById('detail-title').textContent =
    `会话: ${r.session_id.slice(0, 8)}... | 第 ${r.week_number}/${r.total_weeks} 周 | ${r.cursor_date}`;

  const s = r.snapshot || {};
  const pf = s.portfolio || [];
  const fr = s.factor_ranking || [];
  const ss = s.strategy_signals;
  const m = s.market || {};

  // Market overview
  let marketHtml = '';
  if (m) {
    marketHtml = `<div class="row">
      <div class="metric-card"><div class="val">${m.benchmark_close?.toFixed(0) || '-'}</div><div class="lbl">沪深300</div></div>
      <div class="metric-card"><div class="val ${m.benchmark_weekly_return >= 0 ? 'pos' : 'neg'}">${(m.benchmark_weekly_return * 100).toFixed(2)}%</div><div class="lbl">周涨跌</div></div>
      <div class="metric-card"><div class="val">¥${(s.total_value || 0).toLocaleString()}</div><div class="lbl">组合市值</div></div>
      <div class="metric-card"><div class="val">¥${(s.cash || 0).toLocaleString()}</div><div class="lbl">现金</div></div>
    </div>`;
  }

  // Warnings
  let warnHtml = '';
  if (s.data_warnings && s.data_warnings.length) {
    warnHtml = s.data_warnings.map(w => `<div class="warn">${w}</div>`).join('');
  }

  // Portfolio
  let pfHtml = pf.length
    ? `<table><tr><th>代码</th><th>股数</th><th>均价</th><th>现价</th><th>盈亏</th><th>权重</th></tr>` +
      pf.map(p => `<tr>
        <td>${p.ts_code}</td><td>${p.shares}</td>
        <td>¥${p.avg_cost.toFixed(2)}</td><td>¥${(p.current_price || 0).toFixed(2)}</td>
        <td class="${p.pnl_pct >= 0 ? 'pos' : 'neg'}">${(p.pnl_pct * 100).toFixed(2)}%</td>
        <td>${(p.weight_pct * 100).toFixed(1)}%</td>
      </tr>`).join('') + '</table>'
    : '<p class="empty">空仓</p>';

  // Factor ranking
  let frHtml = fr.length
    ? `<table><tr><th>排名</th><th>代码</th><th>综合得分</th></tr>` +
      fr.map(f => `<tr><td>${f.rank}</td><td>${f.ts_code}</td><td>${f.composite_score.toFixed(2)}</td></tr>`).join('') + '</table>'
    : '<p class="empty">暂无因子数据</p>';

  // Strategy signals
  let ssHtml = '';
  if (ss === null) {
    ssHtml = '<p class="empty">无参考策略</p>';
  } else if (ss.length === 0) {
    ssHtml = '<p class="empty">本周无策略信号</p>';
  } else {
    ssHtml = `<table><tr><th>代码</th><th>方向</th><th>目标权重</th><th>理由</th></tr>` +
      ss.map(o => `<tr>
        <td>${o.ts_code}</td>
        <td><span class="tag tag-${o.direction === 'BUY' ? 'buy' : 'sell'}">${o.direction}</span></td>
        <td>${(o.target_pct * 100).toFixed(1)}%</td>
        <td>${o.reason}</td>
      </tr>`).join('') + '</table>';
  }

  // Operations
  const opHtml = `
    <div class="section-title">操作</div>
    <div class="row">
      <div class="form-group"><label>买入 (代码:百分比)</label><input id="buy-in" placeholder="600519.SH:10, 002594.SZ:8"></div>
      <div class="form-group"><label>卖出 (代码)</label><input id="sell-in" placeholder="300750.SZ, 000858.SZ"></div>
      <div class="form-group"><label>备注</label><input id="note-in" placeholder="看好消费"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-primary" onclick="doStep()">提交决策</button>
      <button class="btn btn-success" onclick="doSkip()">跳过本周</button>
      <button class="btn btn-purple" onclick="doCompare()">对比报告</button>
    </div>
  `;

  document.getElementById('detail-content').innerHTML =
    marketHtml + warnHtml +
    '<div class="section-title">持仓</div>' + pfHtml +
    '<div class="section-title">因子排名 Top 15</div>' + frHtml +
    '<div class="section-title">策略建议</div>' + ssHtml +
    opHtml;
}

// ---------- actions ----------
async function doStep() {
  const bi = document.getElementById('buy-in').value.trim();
  const si = document.getElementById('sell-in').value.trim();
  const orders = [];
  if (bi) bi.split(',').forEach(p => {
    const [code, pct] = p.trim().split(':');
    if (code && pct) orders.push({ ts_code: code.trim(), target_pct: Number(pct) / 100, direction: 'BUY' });
  });
  if (si) si.split(',').forEach(c => {
    c = c.trim(); if (c) orders.push({ ts_code: c, target_pct: 0, direction: 'SELL' });
  });
  const notes = document.getElementById('note-in').value.trim();
  if (!orders.length && !notes) {
    if (!confirm('未输入任何订单，确认提交空操作？')) return;
  }
  try {
    const r = await api('/sessions/' + currentId + '/step', { method: 'POST', body: { orders, notes } });
    let msg = `成交 ${r.executed_orders.length} 笔`;
    if (r.executed_orders.length) {
      msg += '\n' + r.executed_orders.map(o => `${o.direction} ${o.ts_code} ${o.shares}股 @ ${o.price}`).join('\n');
    }
    if (r.warnings.length) msg += '\n⚠ ' + r.warnings.join(', ');
    alert(msg);
    openSession(currentId);
    loadSessions();
  } catch (e) { alert('执行失败: ' + e.message); }
}

async function doSkip() {
  if (!confirm('确认跳过本周调仓？')) return;
  try {
    await api('/sessions/' + currentId + '/skip', { method: 'POST' });
    openSession(currentId);
    loadSessions();
  } catch (e) { alert('跳过失败: ' + e.message); }
}

async function doCompare() {
  try {
    const r = await api('/sessions/' + currentId + '/compare');
    const names = { manual: '手动', strategy: '策略', benchmark: '基准' };
    const keys = { total_return: '累计收益', annual_return: '年化收益', sharpe_ratio: '夏普比率', max_drawdown: '最大回撤', win_rate: '周胜率' };

    let html = '<div class="section-title">关键指标</div><div class="metrics-grid">';
    for (const [line, label] of Object.entries(names)) {
      const m = r.metrics[line];
      if (!m) continue;
      html += `<div class="card" style="padding:12px;flex:1;min-width:180px"><h2 style="font-size:14px;margin-bottom:8px">${label}</h2>`;
      for (const [k, lbl] of Object.entries(keys)) {
        const v = m[k];
        const fmt = ['total_return', 'annual_return', 'max_drawdown', 'win_rate'].includes(k)
          ? (v * 100).toFixed(2) + '%' : v?.toFixed(2) || '-';
        html += `<div style="font-size:13px;margin:4px 0"><span style="color:#64748b">${lbl}</span> <span style="font-weight:600;float:right">${fmt}</span></div>`;
      }
      html += '</div>';
    }
    html += '</div>';

    // Weekly diff
    html += '<div class="section-title">逐周决策差异</div><table><tr><th>周</th><th>日期</th><th>你独有</th><th>策略独有</th><th>共同</th><th>警告</th></tr>';
    r.weekly_diffs.forEach(d => {
      html += `<tr>
        <td>${d.week_number}</td><td>${d.cursor_date}</td>
        <td>${d.user_only.join(', ') || '-'}</td><td>${d.strategy_only.join(', ') || '-'}</td>
        <td>${d.common.join(', ') || '-'}</td>
        <td>${d.drawdown_warning ? `<span class="warn">${d.drawdown_warning}</span>` : '-'}</td>
      </tr>`;
    });
    html += '</table>';

    if (r.html_path) {
      html += `<div style="margin-top:12px"><span style="color:#64748b;font-size:13px">HTML 报告:</span> <code>${r.html_path}</code></div>`;
    }

    html += '<br><button class="btn btn-sm btn-gray" onclick="openSession(currentId)">← 返回决策</button>';
    document.getElementById('detail-content').innerHTML = html;
  } catch (e) { alert('对比失败: ' + e.message); }
}

// ---------- init ----------
checkApi();
loadSessions();
setInterval(checkApi, 15000);
setInterval(() => { if (!currentId) loadSessions(); }, 15000);
</script>
</body>
</html>
